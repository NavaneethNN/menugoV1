  <g fill="#ffffff">
    <path d="M 120 376 L 120 160 C 120 148 130 138 142 138 L 176 138 C 188 138 198 145 204 156 L 256 250 L 308 156 C 314 145 324 138 336 138 L 370 138 C 382 138 392 148 392 160 L 392 376 C 392 387 383 396 372 396 L 334 396 C 323 396 314 387 314 376 L 314 260 L 278 324 C 270 338 250 338 242 324 L 206 260 L 206 376 C 206 387 197 396 186 396 L 148 396 C 137 396 128 387 128 376 Z" />
    <!-- Fork & Spark Accent -->
